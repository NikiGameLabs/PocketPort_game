<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Pocket Port: Cargo Tycoon</title>

    <!-- Playgama Bridge Official CDN & Local Fallback -->
    <script src="https://bridge.playgama.com/v2/stable/playgama-bridge.js"></script>
    <script>window.bridge || document.write('<script src="./playgama-bridge.js"><\/script>');</script>

    <!-- Immediate Playgama Bridge Initialization for Automated Validator -->
    <script>
      (function() {
        function bootBridge() {
          if (window.bridge) {
            window.bridge.initialize().then(function() {
              console.log('[Playgama] Bridge initialized successfully!');
              if (window.bridge.setGameLoadingProgress) {
                window.bridge.setGameLoadingProgress(100);
              }
            }).catch(function(e) {
              console.warn('[Playgama] Bridge init warning:', e);
            });
          } else {
            setTimeout(bootBridge, 20);
          }
        }
        bootBridge();
      })();
    </script>

    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="game-container"></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
