<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Pocket Port: Cargo Tycoon</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #0c1524;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        touch-action: none;
      }
      #game-container {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        background: radial-gradient(circle at center, #172554 0%, #0c1524 100%);
      }
      canvas {
        display: block;
        box-shadow: 0 0 35px rgba(0, 0, 0, 0.45);
        border-radius: 8px;
      }
    </style>

    <!-- Playgama Bridge Core Script -->
    <script src="./playgama-bridge.js"></script>

    <!-- Immediate Playgama Bridge Initialization & Game Ready Signal -->
    <script>
      (function() {
        function bootBridge() {
          if (window.bridge && typeof window.bridge.initialize === 'function') {
            window.bridge.initialize().then(function() {
              console.log('[Playgama] Bridge initialized successfully!');
              if (window.bridge.platform && window.bridge.platform.sendMessage) {
                window.bridge.platform.sendMessage('game_ready');
                console.log('[Playgama] Reported game_ready through Bridge SDK!');
              }
              if (window.bridge.setGameLoadingProgress) {
                window.bridge.setGameLoadingProgress(100);
              }
            }).catch(function(e) {
              console.warn('[Playgama] Bridge init warning:', e);
            });
          }
        }
        if (window.bridge) {
          bootBridge();
        } else {
          window.addEventListener('DOMContentLoaded', bootBridge);
        }
      })();
    </script>

    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body style="margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #0c1524;">
    <div id="game-container"></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
